<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<style>
  .head { text-align: center; margin: 20px 0 28px; animation: fadeUp .5s ease both; }
  .head .title { margin: 14px 0 6px; }
  .panel { animation: fadeUp .5s .08s ease both; }
  #staffId { font-size: 24px; text-align: center; letter-spacing: 3px; font-weight: 700; padding: 16px; text-transform: uppercase; }
  .btn.big { padding: 16px; font-size: 17px; margin-top: 6px; }
  .result { text-align: center; animation: pop .45s ease both; }
  .result .mark { width: 84px; height: 84px; border-radius: 50%; margin: 6px auto 18px; display: flex; align-items: center; justify-content: center; font-size: 40px; }
  .result.ok .mark { background: rgba(43,217,159,.15); border: 2px solid var(--green); color: var(--green); }
  .result.info .mark { background: rgba(247,201,72,.15); border: 2px solid var(--gold); color: var(--gold); }
  .result.err .mark { background: rgba(255,93,115,.15); border: 2px solid var(--red); color: var(--red); }
  .result h2 { font-family: var(--display); font-size: 26px; line-height: 1.2; margin-bottom: 6px; }
  .result .name { font-family: var(--display); font-size: 22px; font-weight: 800; color: var(--gold2); margin: 14px 0 2px; }
  .result .dept { color: var(--muted); font-size: 15px; }
  .result .sid { display: inline-block; margin-top: 12px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 6px 14px; font-family: ui-monospace, Menlo, monospace; font-weight: 700; letter-spacing: 2px; }
  .result .time { color: var(--muted); font-size: 13px; margin-top: 14px; }
  .result p.msg { color: var(--muted); font-size: 15px; margin-top: 4px; }
  .result .btn { margin-top: 22px; }
  .luck { margin-top: 18px; font-size: 14px; color: var(--gold2); }
  .closed { text-align: center; padding: 10px 0; }
  .closed h2 { font-family: var(--display); font-size: 22px; margin-bottom: 6px; }
  .countdown { font-size: 12px; color: var(--muted); margin-top: 10px; }
  .result .walkin-btn { margin-top: 22px; }
  .result .walkin-btn + .btn { margin-top: 10px; }
  .wi-head { font-family: var(--display); font-size: 20px; font-weight: 700; margin-bottom: 4px; }
  .wi-sub { color: var(--muted); font-size: 14px; margin-bottom: 18px; }
  .wi-error { color: var(--red); font-size: 14px; min-height: 20px; margin-bottom: 8px; }
  #wiId { text-transform: uppercase; font-weight: 700; letter-spacing: 2px; }
  #walkInPanel .btn + .btn { margin-top: 10px; }
  .family { margin-top: 20px; padding: 18px 16px; background: var(--card); border: 1px solid var(--border); border-radius: 16px; }
  .family .btn { margin-top: 12px; }
  .fam-q { font-weight: 700; font-size: 16px; }
  .fam-sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .stepper { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 14px; }
  .stepper .step { width: 52px; height: 52px; border-radius: 50%; border: 1.5px solid var(--border); background: var(--surface); color: var(--text); font-size: 26px; font-weight: 700; cursor: pointer; }
  .stepper .step:active { transform: scale(.95); }
  .stepper input { width: 90px; text-align: center; font-family: var(--display); font-size: 30px; font-weight: 800; padding: 8px; }
  .family.food { background: linear-gradient(160deg, rgba(247,201,72,.16), rgba(247,201,72,.04)); border: 2px solid var(--gold); animation: pop .45s ease both; }
  .food-icon { font-size: 40px; line-height: 1; }
  .food-title { font-family: var(--display); font-size: 22px; font-weight: 800; margin-top: 8px; }
  .food-sub { color: var(--muted); font-size: 14px; }
  .food-total { margin: 14px auto 4px; display: inline-flex; align-items: baseline; gap: 10px; }
  .food-total span { color: var(--gold2); font-weight: 700; font-size: 16px; text-transform: uppercase; letter-spacing: 2px; }
  .food-total b { font-family: var(--display); font-size: 64px; font-weight: 900; line-height: 1; color: var(--gold2); }
  .food-detail { color: var(--muted); font-size: 14px; }
  .fam-err { color: var(--red); font-size: 13px; min-height: 18px; margin-top: 6px; }
  #wiGroup { max-width: 120px; }
</style>
</head>
<body>
<div class="wrap narrow">
  <div class="head">
    <span class="badge">Event Registration</span>
    <h1 class="title" id="eventName">Registration</h1>
    <p class="subtitle" id="eventDate"></p>
  </div>

  <div class="panel" id="formPanel">
    <form id="regForm" autocomplete="off">
      <label class="field">
        <span>Enter your Staff ID</span>
        <input type="text" id="staffId" maxlength="40" autocapitalize="characters" autocorrect="off" spellcheck="false" placeholder="e.g. 123456" required>
      </label>
      <button class="btn gold block big" id="submitBtn" type="submit">Register</button>
    </form>
  </div>

  <div class="panel hidden" id="resultPanel"></div>

  <div class="panel hidden" id="walkInPanel">
    <form id="walkInForm" autocomplete="off">
      <div class="wi-head">Register as a new participant</div>
      <div class="wi-sub">Your Staff ID is not in the participant list. Fill in your details to register.</div>
      <label class="field"><span>Staff ID</span>
        <input type="text" id="wiId" maxlength="40" autocapitalize="characters" autocorrect="off" spellcheck="false" required>
      </label>
      <label class="field"><span>Full name</span>
        <input type="text" id="wiName" maxlength="150" autocapitalize="words" required>
      </label>
      <label class="field"><span>Department</span>
        <select id="wiDeptSelect"></select>
        <input type="text" id="wiDeptText" maxlength="150" class="hidden" placeholder="Your department">
      </label>
      <label class="field"><span>How many people in your group, including you? (for food)</span>
        <input type="number" id="wiGroup" min="1" max="51" inputmode="numeric" value="1" required>
      </label>
      <div class="wi-error" id="wiError"></div>
      <button class="btn gold block big" id="wiSubmit" type="submit">Register</button>
      <button class="btn ghost block" type="button" onclick="resetForm()">Back</button>
    </form>
  </div>

  <div class="panel hidden" id="closedPanel">
    <div class="closed">
      <h2>Registration is closed</h2>
      <p class="muted">Please see the registration counter if you need help.</p>
    </div>
  </div>
</div>

<script src="assets/app.js"></script>
<script>
  // ?kiosk=1 → returns to the form automatically (for a shared tablet at the door)
  var KIOSK = new URLSearchParams(location.search).get('kiosk') === '1';
  var form = document.getElementById('regForm');
  var input = document.getElementById('staffId');
  var btn = document.getElementById('submitBtn');
  var formPanel = document.getElementById('formPanel');
  var resultPanel = document.getElementById('resultPanel');
  var kioskTimer;
  var eventInfo = { allowWalkIn: true, departments: [] };
  var walkInPanel = document.getElementById('walkInPanel');

  function loadEvent() {
    if (!App.isConfigured()) { App.toast('API URL not set. Edit docs/assets/app.js.', 'error'); return; }
    App.get({ action: 'info' }).then(function (res) {
      if (!res.success) return;
      eventInfo = res.event;
      document.getElementById('eventName').textContent = res.event.name || 'Registration';
      document.getElementById('eventDate').textContent = res.event.date || '';
      document.title = 'Register · ' + (res.event.name || 'Event');
      if (!res.event.registrationOpen) {
        formPanel.classList.add('hidden');
        document.getElementById('closedPanel').classList.remove('hidden');
      }
    }).catch(function () {});
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var id = input.value.trim();
    if (!id) return;
    lastId = id;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Registering…';
    App.post({ action: 'register', staffId: id }).then(showResult).catch(function () {
      showResult({ success: false, message: 'Cannot reach the server. Please check your internet connection and try again.' });
    }).then(function () {
      btn.disabled = false;
      btn.textContent = 'Register';
    });
  });

  function showResult(res) {
    var html;
    if (res.success && !res.already) {
      html = '<div class="result ok"><div class="mark">✓</div>' +
        '<h2>You are registered!</h2>' + personHtml(res) +
        '<div class="time">Registered at ' + App.esc(res.registeredAt) + '</div>' +
        '<div class="family" id="familyBox"></div>' +
        '<div class="luck">🍀 You are now in the lucky draw. Good luck!</div>';
    } else if (res.success && res.already) {
      html = '<div class="result info"><div class="mark">i</div>' +
        '<h2>Already registered</h2>' + personHtml(res) +
        '<div class="time">First registered at ' + App.esc(res.registeredAt) + '</div>' +
        '<div class="family" id="familyBox"></div>';
    } else if (res.closed) {
      html = '<div class="result err"><div class="mark">✕</div><h2>Registration is closed</h2>' +
        '<p class="msg">Please see the registration counter.</p>';
    } else if (res.notFound && eventInfo.allowWalkIn !== false) {
      html = '<div class="result err"><div class="mark">?</div><h2>Staff ID not found</h2>' +
        '<p class="msg">' + App.esc(lastId) + ' is not in the participant list. Check the number, or register as a new participant.</p>' +
        '<button class="btn gold block walkin-btn" type="button" onclick="showWalkIn()">Register as a new participant</button>';
    } else {
      html = '<div class="result err"><div class="mark">✕</div><h2>Not registered</h2>' +
        '<p class="msg">' + App.esc(res.message || 'Something went wrong.') + '</p>';
    }
    html += '<button class="btn ghost block" type="button" onclick="resetForm()">' +
      (res.success ? 'Register another person' : 'Try again') + '</button>' +
      (KIOSK && res.success ? '<div class="countdown">Returning automatically…</div>' : '') + '</div>';

    resultPanel.innerHTML = html;
    formPanel.classList.add('hidden');
    resultPanel.classList.remove('hidden');

    current = res.success ? res.participant : null;
    var askFamily = current && current.familyPresent == null;
    if (current) renderFamily(askFamily ? 'ask' : 'done');
    if (KIOSK) {
      clearTimeout(kioskTimer);
      kioskTimer = setTimeout(resetForm, askFamily ? 45000 : res.success ? 8000 : res.notFound ? 30000 : 8000);
    }
  }

  // ── Group size for food (pre-filled from the survey) ─────
  // The sheet stores family members only; the screen shows the group
  // total including the staff member, i.e. family + 1.
  var current = null;
  var GROUP_MAX = 51;

  function renderFamily(mode) {
    var box = document.getElementById('familyBox');
    if (!box || !current) return;
    var p = current;
    if (mode === 'done') {
      var fam = p.familyPresent;
      box.className = 'family food';
      box.innerHTML = '<div class="food-icon">🍱</div>' +
        '<div class="food-title">Please collect your food</div>' +
        '<div class="food-sub">Sila ambil makanan anda</div>' +
        '<div class="food-total"><span>Total</span><b>' + (fam + 1) + '</b></div>' +
        '<div class="food-detail">' + (fam === 0 ? 'Just you' : 'You + ' + fam + ' family member' + (fam === 1 ? '' : 's')) + '</div>' +
        '<button class="btn ghost small" type="button" onclick="renderFamily(\'ask\')">Change group size</button>';
      return;
    }
    var fam0 = p.familyPresent != null ? p.familyPresent : (p.familyExpected != null ? p.familyExpected : 0);
    box.className = 'family';
    box.innerHTML = '<div class="fam-q">How many people in your group, including you?</div>' +
      '<div class="fam-sub">For food distribution' + (p.familyExpected != null ? ' · From the survey: ' + (p.familyExpected + 1) : '') + '</div>' +
      '<div class="stepper">' +
        '<button type="button" class="step" onclick="stepFamily(-1)" aria-label="Fewer">−</button>' +
        '<input type="number" id="famCount" min="1" max="' + GROUP_MAX + '" inputmode="numeric" value="' + (fam0 + 1) + '" aria-label="People in your group">' +
        '<button type="button" class="step" onclick="stepFamily(1)" aria-label="More">+</button>' +
      '</div>' +
      '<button class="btn gold block" id="famSave" type="button" onclick="saveFamily()">Confirm</button>' +
      '<div class="fam-err" id="famErr"></div>';
  }

  function stepFamily(d) {
    var el = document.getElementById('famCount');
    el.value = Math.max(1, Math.min(GROUP_MAX, (parseInt(el.value, 10) || 1) + d));
  }

  function saveFamily() {
    var total = Number(document.getElementById('famCount').value);
    var err = document.getElementById('famErr');
    var b = document.getElementById('famSave');
    if (!(Math.floor(total) === total && total >= 1 && total <= GROUP_MAX)) {
      err.textContent = 'Please enter a number between 1 and ' + GROUP_MAX + '.'; return;
    }
    b.disabled = true;
    b.innerHTML = '<span class="spinner"></span> Saving…';
    App.post({ action: 'setFamily', staffId: current.staffId, count: total - 1 }).then(function (res) {
      if (!res.success) {
        b.disabled = false; b.textContent = 'Confirm';
        err.textContent = res.message || 'Could not save. Please try again.';
        return;
      }
      current.familyPresent = total - 1;
      renderFamily('done');
      if (KIOSK) { clearTimeout(kioskTimer); kioskTimer = setTimeout(resetForm, 8000); }
    }).catch(function () {
      b.disabled = false; b.textContent = 'Confirm';
      err.textContent = 'Cannot reach the server. Please try again.';
    });
  }

  function personHtml(res) {
    var p = res.participant;
    return '<div class="name">' + App.esc(p.name) + '</div>' +
      '<div class="dept">' + App.esc(p.department) + '</div>' +
      '<div class="sid">' + App.esc(p.staffId) + '</div>';
  }

  function resetForm() {
    clearTimeout(kioskTimer);
    input.value = '';
    resultPanel.classList.add('hidden');
    walkInPanel.classList.add('hidden');
    formPanel.classList.remove('hidden');
    input.focus();
  }

  // ── Walk-in: staff not in the imported list ──────────────
  var lastId = '';
  var deptSelect = document.getElementById('wiDeptSelect');
  var deptText = document.getElementById('wiDeptText');

  function showWalkIn() {
    clearTimeout(kioskTimer);
    var depts = eventInfo.departments || [];
    var useList = depts.length > 0;
    deptSelect.classList.toggle('hidden', !useList);
    deptText.classList.toggle('hidden', useList);
    deptSelect.required = useList;
    deptText.required = !useList;
    deptSelect.innerHTML = '<option value="">Choose your department…</option>' + depts.map(function (d) {
      return '<option>' + App.esc(d) + '</option>';
    }).join('');
    document.getElementById('wiId').value = lastId;
    document.getElementById('wiName').value = '';
    document.getElementById('wiGroup').value = 1;
    deptText.value = '';
    document.getElementById('wiError').textContent = '';
    resultPanel.classList.add('hidden');
    walkInPanel.classList.remove('hidden');
    document.getElementById('wiName').focus();
    if (KIOSK) kioskTimer = setTimeout(resetForm, 180000);
  }

  document.getElementById('walkInForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var useList = !deptSelect.classList.contains('hidden');
    var body = {
      action: 'registerNew',
      staffId: document.getElementById('wiId').value.trim(),
      name: document.getElementById('wiName').value.trim(),
      department: (useList ? deptSelect.value : deptText.value).trim(),
      family: Number(document.getElementById('wiGroup').value) - 1
    };
    var err = document.getElementById('wiError');
    var btn = document.getElementById('wiSubmit');
    if (!body.staffId || !body.name || !body.department) { err.textContent = 'Please fill in all fields.'; return; }
    if (!(Math.floor(body.family) === body.family && body.family >= 0 && body.family <= 50)) {
      err.textContent = 'People in your group must be a number between 1 and 51.'; return;
    }
    err.textContent = '';
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Registering…';
    App.post(body).then(function (res) {
      if (res.success || res.closed) {
        walkInPanel.classList.add('hidden');
        showResult(res);
      } else {
        err.textContent = res.message || 'Something went wrong.';
      }
    }).catch(function () {
      err.textContent = 'Cannot reach the server. Please check your internet connection and try again.';
    }).then(function () {
      btn.disabled = false;
      btn.textContent = 'Register';
    });
  });

  loadEvent();
  input.focus();
</script>
</body>
</html>
